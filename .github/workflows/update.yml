name: Daily Homepage Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update script
        run: python update_homepage.py

      - name: Commit and push changes
        run: |
          git config --local user.email "emilynickhomepage@users.noreply.github.com"
          git config --local user.name "emilynickhomepage"
          
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily update"
          git push